mod_description=Neutral, event-driven attributes meant to be granted by skill tree mods: hunting, fishing, farming, cooking, alchemy, blacksmithing (upgrades, repair, gem sockets), enchanting, spell scrolls, stealth and combat, mining, woodcutting, pets, trading and more. Right-click one item onto another in your inventory to craft, upgrade and combine. Every attribute is 0 by default, so vanilla is untouched until something grants it. Optional integrations: Apotheosis, Iron's Spellbooks, Tinkers' Construct, Quality Food, Kaleidoscope Cookery, Stardew Fishing, Consecration and Obscure Tooltips.
